server:
  port: 8081

spring:
  application:
    name: omnispace

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:omnispace}
    username: ${DB_USER:omnispace}
    password: ${DB_PASSWORD:omnispace}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-min-256-bits-long}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    refresh-concurrency-window-seconds: ${REFRESH_CONCURRENCY_WINDOW_SECONDS:5}
  booking:
    max-duration-hours: 4
  academic:
    # Used by RoutineSchedulerService's semester-boundary cleanup job.
    # Update these (or wire them to an admin-editable setting) at the start
    # of each new semester/academic year.
    current-academic-year: ${CURRENT_ACADEMIC_YEAR:2025-2026}
    current-semester: ${CURRENT_SEMESTER:Fall}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

logging:
  level:
    com.bookingapp: INFO
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    persist-authorization: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
